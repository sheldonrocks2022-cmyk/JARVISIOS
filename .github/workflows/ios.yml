name: iOS Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Build llama.cpp XCFramework
        run: |
          git clone --depth 1 https://github.com/ggml-org/llama.cpp.git .llama-src
          cd .llama-src
          ./build-xcframework.sh
          cd ..
          mkdir -p Frameworks
          cp -R .llama-src/build-apple/llama.xcframework Frameworks/
      - name: Generate project
        run: xcodegen generate
      - name: Build simulator
        run: xcodebuild -project JARVISIOS.xcodeproj -scheme JARVISIOS -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -configuration Debug CODE_SIGNING_ALLOWED=NO build
